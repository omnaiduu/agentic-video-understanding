[project]
name = "agentic-video-backend"
version = "0.1.0"
description = "Phases 1–5: hold a video, cut slices, chat JSON loop, speech index, picture index."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "ffmpeg-python>=0.2.0",
    "openai>=1.60.0",
    "pgvector>=0.5.0",
]

[project.optional-dependencies]
local-ingest = [
    "faster-whisper>=1.1.0",
    "sentence-transformers>=3.3.0",
    "transformers>=4.49.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
