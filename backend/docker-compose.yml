services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
